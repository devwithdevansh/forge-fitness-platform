# Render blueprint for the FORGE Gym Platform Ecosystem
services:
  # ── FORGE REST API Backend ──
  - type: web
    name: forge-gym-api
    runtime: node
    plan: free
    rootDir: forge-gym/api
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: gym
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://demo-web-forge-gym.onrender.com,https://demo-web-gym-saas.onrender.com,https://demo-web-gym-member.onrender.com

  # ── Public Marketing & Demo Website ──
  - type: static
    name: demo-web-forge-gym
    rootDir: forge-gym/web/website
    buildCommand: npm install && npm run build
    publishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ── SaaS Management Portal ──
  - type: static
    name: demo-web-gym-saas
    rootDir: forge-gym/web/saas
    buildCommand: npm install && npm run build
    publishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ── Member Digital Pass & Check-In App ──
  - type: static
    name: demo-web-gym-member
    rootDir: forge-gym/web/member
    buildCommand: npm install && npm run build
    publishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ── Super Admin Console ──
  - type: static
    name: demo-web-gym-admin
    rootDir: forge-gym/web/admin
    buildCommand: npm install && npm run build
    publishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
